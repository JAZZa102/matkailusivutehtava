<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matkatoive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="rajaus header-content">
            <a href="index.html" class="logo">Matkayhtiö</a>
            <nav>
                <a href="index.html">Etusivu</a>
                <a href="matkainfo.html">Matkainfo</a>
                <a href="matkatoive.html">Matkatoive</a>
            </nav>
        </div>
    </header>
    <main>
        <h1 class="keskitetty">Lähetä matkatoiveesi</h1>
        <p class="keskitetty">Täytä alla oleva lomake</p>
        <section class="topics" id="contact">
            <div class="container">

                <h2 class="keskitetty">Contact Us</h2>

                <form class="card" action="https://httpbin.org/post" method="post">

                    <div class="form-row keskitetty">
                        <label for="email">Sähköposti*</label>
                        <input type="email" id="email" name="email" required maxlength="120" />
                    </div>

                    <div class="form-row keskitetty">
                        <label for="subject">Matka tapa*</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected></option>
                            <option value="juna">Juna</option>
                            <option value="laiva">Laiva</option>
                            <option value="lentokone">Lentokone</option>
                        </select>
                    </div>

                    <div class="form-row keskitetty">
                        <label for="date">Lähtöpäivä*</label>
                        <input type="date" required value="date" name="date">
                    </div>

                    <div class="form-row keskitetty">
                        <label for="number">Matkustajien määrä*</label>
                        <input id="number" name="number" required min="1" max="8"></input>
                    </div>

                    <button class="nappi" type="submit">Send</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>Matkayhtiö</p>
            <p>|</p>
            <p>Puh: 123 456 7890</p>
        </div>
    </footer>
</body>
</html>
